# FastUpload Nginx Configuration
# Optimized for large file uploads with TUS protocol

# Upstream configuration
upstream fastupload {
    server 127.0.0.1:3003; # FastUpload server port
    keepalive 64;
}

# HTTP Server (Ready for HTTPS upgrade)
server {
    listen 80;
    listen [::]:80;

    # Domain name (update this)
    server_name your-domain.com www.your-domain.com;

    # Maximum upload size (50GB as configured in FastUpload)
    # Important: Must be >= MAX_FILE_SIZE in .env
    client_max_body_size 50G;

    # Timeouts for large file uploads
    # Increase these for slow networks or large files
    client_body_timeout 300s;       # Maximum time for client to send body
    client_header_timeout 300s;     # Maximum time for client to send header
    send_timeout 300s;               # Maximum time for response transmission

    # Proxy timeouts
    # Increase these for long-running uploads
    proxy_connect_timeout 300s;       # Timeout for establishing connection
    proxy_send_timeout 300s;          # Timeout for sending request to upstream
    proxy_read_timeout 300s;          # Timeout for reading response from upstream

    # Buffer sizes
    # Optimized for TUS protocol chunk uploads
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    client_body_buffer_size 128k;

    # Disable request buffering for TUS PATCH requests
    # TUS PATCH requests should be streamed directly
    proxy_request_buffering off;

    # Access and error logs
    access_log /var/log/nginx/fastupload_access.log;
    error_log /var/log/nginx/fastupload_error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression (for text responses)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Root location (redirect to FastUpload)
    location / {
        # Proxy to FastUpload
        proxy_pass http://fastupload;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # TUS Protocol Headers (Important!)
        # These headers are required by TUS protocol
        proxy_set_header Tus-Resumable "1.0.0";
        proxy_set_header Upload-Offset "";
        proxy_set_header Upload-Length "";
        proxy_set_header Upload-Metadata "";
        proxy_set_header Tus-Version "1.0.0";

        # Pass through all headers from FastUpload
        proxy_pass_request_headers on;

        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for this location
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # TUS Upload endpoint (specific optimizations)
    location /upload {
        # Proxy to FastUpload
        proxy_pass http://fastupload;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # TUS Protocol Headers
        proxy_set_header Tus-Resumable "1.0.0";
        proxy_set_header Upload-Offset "";
        proxy_set_header Upload-Length "";
        proxy_set_header Upload-Metadata "";
        proxy_set_header Tus-Version "1.0.0";

        # Disable buffering for TUS PATCH requests
        # Critical for resumable uploads!
        proxy_request_buffering off;
        proxy_buffering off;

        # Timeouts (longer for upload endpoint)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static files (if you want Nginx to serve them directly)
    # Uncomment if you want better performance for static files
    # location /static/ {
    #     alias /path/to/fastupload/public/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }

    # Health check endpoint (for monitoring)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to hidden files and backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

