# Example Nginx Configuration for FastUpload
# Adapted for your specific setup

upstream fastupload {
    server 127.0.0.1:3003;  # FastUpload runs on port 3003
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;

    # Update with your actual domain name
    server_name your-domain.com;  # OR your-server-ip (e.g., 172.21.0.1)

    # Upload size limit (must match MAX_FILE_SIZE_GB in .env)
    # If you changed MAX_FILE_SIZE_GB to 100, change this to 100G
    client_max_body_size 50G;

    # Timeouts for large file uploads
    client_body_timeout 300s;       # Time for client to send body
    client_header_timeout 300s;     # Time for client to send header
    send_timeout 300s;               # Time for response transmission

    # Proxy timeouts
    proxy_connect_timeout 300s;       # Time to establish connection
    proxy_send_timeout 300s;          # Time to send request
    proxy_read_timeout 300s;          # Time to read response

    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    client_body_buffer_size 128k;

    # Critical for TUS: Disable request buffering for PATCH requests
    proxy_request_buffering off;

    # Logging
    access_log /var/log/nginx/fastupload_access.log;
    error_log /var/log/nginx/fastupload_error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript;

    # Root location
    location / {
        proxy_pass http://fastupload;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # TUS Protocol Headers
        proxy_set_header Tus-Resumable "1.0.0";
        proxy_set_header Upload-Offset "";
        proxy_set_header Upload-Length "";
        proxy_set_header Upload-Metadata "";
        proxy_set_header Tus-Version "1.0.0";

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # TUS Upload endpoint
    location /upload {
        proxy_pass http://fastupload;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # TUS Headers
        proxy_set_header Tus-Resumable "1.0.0";
        proxy_set_header Upload-Offset "";
        proxy_set_header Upload-Length "";
        proxy_set_header Upload-Metadata "";
        proxy_set_header Tus-Version "1.0.0";

        # CRITICAL: Disable buffering for TUS PATCH requests
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Longer timeouts for uploads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
